<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>如果电话亭</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #171717; --paper: #f4eee3; --night: #0b0e14; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--night); }
        body { font-family: "ZCOOL KuaiLe", "Microsoft YaHei", sans-serif; color: var(--ink); }
        button, input { font: inherit; }
        .page { display: none; position: fixed; inset: 0; overflow: hidden; }
        .page.active { display: block; }
        .art-page { background: var(--paper) center / cover no-repeat; }
        .art-page::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: rgba(255,255,255,.02); }
        .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; pointer-events: none; }
        .contained-art { background: #fff; }
        .contained-art .art { object-fit: contain; }
        .hotzone { position: absolute; z-index: 3; cursor: pointer; background: transparent; border: 0; }
        .hotzone:focus-visible { outline: 3px dashed #c33; outline-offset: 4px; }
        .coin-number { position: absolute; z-index: 4; top: 40.5%; right: 46.5%; color: #000; font-size: clamp(1.25rem, 3vw, 2rem); letter-spacing: .08em; transform: rotate(-3deg); pointer-events: none; }
        .menu-start { top: 49%; left: 29%; width: 37%; height: 25%; }
        .menu-history { top: 74%; left: 29%; width: 40%; height: 23%; }
        #pageGif { background: #111; }
        #pageGif .art { object-fit: contain; cursor: pointer; }
        .skip-note { position: absolute; z-index: 2; left: 0; right: 0; bottom: 5%; text-align: center; color: rgba(255,255,255,.55); font-size: .9rem; pointer-events: none; }
        .page-call { background: #e8dfd1; }
        .call-panel { position: absolute; z-index: 2; left: 50%; top: 52%; width: min(72vw, 35rem); transform: translate(-50%, -50%); text-align: center; }
        .call-panel h1 { margin-bottom: 1rem; font-size: clamp(1.8rem, 4vw, 3.2rem); font-weight: 400; }
        .call-panel p { margin-bottom: 1.3rem; font-size: clamp(1rem, 2vw, 1.35rem); }
        .call-panel input { width: min(100%, 29rem); padding: .8rem 1rem; border: 2px solid var(--ink); border-radius: .25rem; outline: none; background: rgba(255,255,255,.72); color: var(--ink); text-align: center; font-size: clamp(1rem, 2vw, 1.3rem); }
        .ink-button { padding: .7rem 1.6rem; border: 2px solid var(--ink); border-radius: .25rem; background: rgba(255,255,255,.45); color: var(--ink); cursor: pointer; font-size: clamp(1rem, 2vw, 1.35rem); }
        .ink-button:hover, .ink-button:focus-visible { background: rgba(255,255,255,.9); }
        .dial-button { display: block; margin: 1.2rem auto 0; }
        .hint { min-height: 1.5em; margin-top: .8rem; font-size: 1rem; }
        #pageLoading { background: #292929; color: #fff; align-items: center; justify-content: center; text-align: center; }
        #pageLoading.active { display: flex; }
        #pageLoading p { font-size: clamp(1.4rem, 3vw, 2rem); }
        #pageLoading .small { margin-top: .8rem; color: #aaa; font-size: .9rem; }
        .story-copy { position: absolute; z-index: 2; left: 50%; top: 7%; width: min(72vw, 55rem); height: 70%; transform: translateX(-50%); overflow: hidden; padding: 0 1.2rem; color: var(--ink); font-size: clamp(1.35rem, 2.4vw, 2rem); line-height: 14.2vh; text-align: left; white-space: pre-wrap; }
        .story-hotzone { position: absolute; z-index: 3; inset: 0; cursor: pointer; }
        .story-progress { position: absolute; z-index: 2; right: 5%; bottom: 5%; font-size: .95rem; }
        .choice-zone { top: 25%; height: 34%; width: 28%; }
        .choice-stay { left: 11%; }
        .choice-leave { right: 11%; }
        .choice-label { position: absolute; z-index: 2; bottom: 12%; color: transparent; pointer-events: none; }
        #pageTransition { background: #fff; color: #111; align-items: center; justify-content: center; text-align: center; }
        #pageTransition.active { display: flex; }
        #pageTransition .transition-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .45s; }
        #pageTransition.show-door .transition-image { opacity: 1; }
        .transition-copy { position: relative; z-index: 2; width: min(80vw, 40rem); padding: 1.5rem; font-size: clamp(1.5rem, 4vw, 3rem); line-height: 1.7; cursor: pointer; }
        .transition-copy small { display: block; margin-top: 1rem; font-size: .9rem; }
        .restart-zone { top: 35%; left: 27%; width: 48%; height: 32%; }
        #pageHistory { background: #eee5d7; }
        .history-list { position: absolute; z-index: 2; left: 36%; top: 17%; width: 37%; height: 70%; overflow: hidden; font-family: inherit; }
        .record { display: block; width: 100%; height: 25%; padding: 3% 3%; border: 0; border-bottom: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; font-size: clamp(1rem, 2vw, 1.55rem); line-height: 1.25; }
        .record:hover, .record:focus-visible { background: rgba(0,0,0,.05); outline: none; }
        .record strong { display: block; overflow: hidden; font-family: inherit; white-space: nowrap; text-overflow: ellipsis; }
        .record span { display: none; }
        .history-page-zone { position: absolute; z-index: 3; bottom: 0; width: 20%; height: 15%; cursor: pointer; background: transparent; border: 0; }
        .history-prev { left: 18%; width: 18%; }
        .history-next { right: 11%; width: 18%; }
        .history-exit { position: absolute; z-index: 3; top: 0; right: 0; width: 18%; height: 14%; cursor: pointer; background: transparent; border: 0; }
        #pageHistoryRead .history-read-copy { top: 7%; }
        .history-read-next { position: absolute; z-index: 3; inset: 0; cursor: pointer; }
        .history-back-zone { top: 3%; left: 4%; width: 14%; height: 10%; }
        .history-read-progress { position: absolute; z-index: 4; right: 5%; bottom: 5%; font-size: .95rem; pointer-events: none; }
        @media (max-width: 640px) {
            .coin-number { right: 44%; }
            .call-panel { width: 78vw; top: 54%; }
            .story-copy { width: 78vw; top: 7%; height: 70%; padding: 0 .6rem; font-size: 1.2rem; line-height: 14.2vh; }
            .history-list { left: 24%; width: 58%; top: 19%; height: 67%; }
            .record { padding: 2.2% 1%; font-size: .95rem; }
        }
    </style>
</head>
<body>
    <audio id="audioDoor" src="images/audio/door-opening-sound.mp3" preload="auto"></audio>
    <audio id="audioPage" src="images/audio/page-flip-sound.mp3" preload="auto"></audio>
    <audio id="audioConnecting" src="images/audio/phone.mp3" preload="auto" loop></audio>
    <audio id="audioPickup" src="images/audio/picked-up-the-phone.mp3" preload="auto"></audio>
    <audio id="audioSwitch" src="images/audio/switch-button.mp3" preload="auto"></audio>
    <audio id="audioLight" src="images/audio/the-sound-of-a-beam-of-light.mp3" preload="auto"></audio>
    <audio id="audioEarth" src="images/audio/the-sound-of-the-planet-earth39s-magnetosphere-from-space.mp3" preload="auto" loop></audio>
    <audio id="audioCoin" src="images/audio/coin-fell-off-after-hanging-up.mp3" preload="auto"></audio>
    <main id="pageMenu" class="page art-page active">
        <img class="art" src="images/menu_bg.PNG" alt="如果电话亭菜单">
        <span id="handDrawnCoin" class="coin-number">0</span>
        <button class="hotzone menu-start" onclick="goGif()" aria-label="开始"></button>
        <button class="hotzone menu-history" onclick="openHistory()" aria-label="通话记录"></button>
    </main>
    <main id="pageGif" class="page">
        <img id="gifPlayer" class="art" src="images/loading.gif" alt="走进电话亭">
        <p class="skip-note">点击画面跳过</p>
    </main>
    <main id="pagePhone" class="page page-call">
        <img class="art" src="images/call.png" alt="拿起电话">
        <section class="call-panel">
            <h1>说出你的遗憾</h1>
            <p>如果另一个你，走了另一条路</p>
            <input id="ifInput" type="text" value="如果当年没走艺术" placeholder="如果当年...">
            <button id="dialBtn" class="ink-button dial-button" onclick="dial()">拨通</button>
            <p id="dialHint" class="hint"></p>
        </section>
    </main>
    <main id="pageLoading" class="page">
        <section><p>连接平行世界中...</p><p class="small">请稍等</p></section>
    </main>
    <main id="pageStory" class="page art-page">
        <img class="art" src="images/reading.PNG" alt="阅读平行人生">
        <div id="storyBox" class="story-copy">点击拨通，听见另一种人生。</div>
        <button class="hotzone story-hotzone" onclick="nextPart()" aria-label="继续阅读"></button>
        <span class="story-progress"><span id="progressNum">1</span> / <span id="storyTotal">1</span></span>
    </main>
    <main id="pageChoice" class="page art-page contained-art">
        <img class="art" src="images/leave-or-stay.PNG" alt="留下还是离开">
        <button class="hotzone choice-zone choice-stay" onclick="choosePath('stay')" aria-label="留下"></button>
        <button class="hotzone choice-zone choice-leave" onclick="choosePath('leave')" aria-label="离开"></button>
    </main>
    <main id="pageTransition" class="page">
        <img class="transition-image" src="images/door-open.PNG" alt="打开的门">
        <div id="transitionCopy" class="transition-copy"></div>
    </main>
    <main id="pageEnd" class="page art-page contained-art">
        <img class="art" src="images/again.PNG" alt="回到现实">
        <p id="endReflection" class="story-copy" style="top:auto; bottom:20%; height:auto; text-align:center;"></p>
        <button class="hotzone restart-zone" onclick="restartGame()" aria-label="再投一枚币"></button>
    </main>
    <main id="pageHistory" class="page art-page">
        <img class="art" src="images/history.PNG" alt="通话记录">
        <div id="historyList" class="history-list"></div>
        <button class="history-page-zone history-prev" onclick="previousHistoryPage()" aria-label="上一页"></button>
        <button class="history-page-zone history-next" onclick="nextHistoryPage()" aria-label="下一页"></button>
        <button class="history-exit" onclick="closeHistory()" aria-label="返回菜单"></button>
    </main>
    <main id="pageHistoryRead" class="page art-page">
        <img class="art" src="images/reading.PNG" alt="阅读通话记录">
        <div id="historyReadCopy" class="story-copy history-read-copy"></div>
        <button class="hotzone history-read-next" onclick="nextHistoryEntryPart()" aria-label="继续阅读"></button>
        <button class="hotzone history-back-zone" onclick="closeHistoryRead()" aria-label="返回通话记录"></button>
        <span class="history-read-progress"><span id="historyReadProgressNum">1</span> / <span id="historyReadTotal">1</span></span>
    </main>
    <script>
        const GIF_DURATION = 12000;
        let coinCount = Number(localStorage.getItem('ifCoin')) || 0;
        let storyChunks = [];
        let currentIndex = 0;
        let selectedPath = 'leave';
        let transitionStep = 0;
        let transitionTimer;
        let gifTimer;
        let historyPage = 0;
        let historyReadChunks = [];
        let historyReadIndex = 0;
        function showPage(id) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'pageMenu') {
                document.getElementById('audioEarth').play();
            } else {
                document.getElementById('audioEarth').pause();
                document.getElementById('audioEarth').currentTime = 0;
            }
            requestAnimationFrame(syncContainedHotzones);
        }
        function syncContainedHotzones() {
            const mappings = [
                ['pageChoice', '.choice-stay', { left: .11, top: .25, width: .28, height: .34 }],
                ['pageChoice', '.choice-leave', { left: .61, top: .25, width: .28, height: .34 }],
                ['pageEnd', '.restart-zone', { left: .27, top: .35, width: .48, height: .32 }]
            ];
            mappings.forEach(([pageId, selector, area]) => {
                const page = document.getElementById(pageId);
                const image = page.querySelector('.art');
                const zone = page.querySelector(selector);
                if (!image || !zone || !image.complete) return;
                const container = image.getBoundingClientRect();
                const scale = Math.min(container.width / image.naturalWidth, container.height / image.naturalHeight);
                const imageWidth = image.naturalWidth * scale;
                const imageHeight = image.naturalHeight * scale;
                const imageLeft = container.left + (container.width - imageWidth) / 2;
                const imageTop = container.top + (container.height - imageHeight) / 2;
                zone.style.left = imageLeft + imageWidth * area.left + 'px';
                zone.style.top = imageTop + imageHeight * area.top + 'px';
                zone.style.width = imageWidth * area.width + 'px';
                zone.style.height = imageHeight * area.height + 'px';
            });
        }
        window.addEventListener('resize', syncContainedHotzones);
        function updateCoinUI() { document.getElementById('handDrawnCoin').textContent = coinCount; }
        function enterPhone() { document.getElementById('audioPickup').play(); clearTimeout(gifTimer); showPage('pagePhone'); document.getElementById('ifInput').focus(); document.getElementById('ifInput').select(); }
        function goGif() { document.getElementById('audioSwitch').play(); document.getElementById('audioCoin').play(); clearTimeout(gifTimer); showPage('pageGif'); document.getElementById('gifPlayer').src = 'images/loading.gif?play=' + Date.now(); gifTimer = setTimeout(enterPhone, GIF_DURATION); }
        document.getElementById('pageGif').addEventListener('click', enterPhone);
        document.getElementById('pageTransition').addEventListener('click', advanceTransition);
        async function dial() {
            document.getElementById('audioSwitch').play();
            const input = document.getElementById('ifInput'); let text = input.value.trim();
            if (!text) { alert('请写下你的遗憾'); return; }
            if (!text.startsWith('如果')) text = '如果' + text;
            coinCount++; localStorage.setItem('ifCoin', coinCount); updateCoinUI();
            document.getElementById('dialBtn').disabled = true; document.getElementById('dialHint').textContent = '正在拨通...'; showPage('pageLoading'); document.getElementById('audioConnecting').play();
            let rawStory = '';
            try {
                const response = await fetch('/story', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, path_type: '自我实现' }) });
                const data = await response.json(); if (!data.success) throw new Error('story failed'); rawStory = data.text; document.getElementById('audioConnecting').pause(); document.getElementById('audioConnecting').currentTime = 0;
            } catch (error) { document.getElementById('audioConnecting').pause(); document.getElementById('audioConnecting').currentTime = 0; rawStory = '你走进那条没有选择的路。清晨的窗光落在桌面，新的工作、新的账单和没有回完的消息一起到来。|||你伸手关掉闹钟，门外有人叫你的名字。'; }
            showPage('pageStory');
            storyChunks = splitByDelimiter(rawStory, document.getElementById('storyBox'));
            saveHistory(text, rawStory); document.getElementById('dialBtn').disabled = false; document.getElementById('dialHint').textContent = ''; currentIndex = 0; renderChunk(); showPage('pageStory');
        }
        function splitByDelimiter(text, measureElement) {
            const sections = text.split('|||').map(item => item.trim()).filter(Boolean);
            const pages = [];
            const box = measureElement || document.getElementById('storyBox');
            const originalText = box ? box.textContent : '';
            sections.forEach(section => {
                let remaining = section;
                while (remaining) {
                    if (!box || !box.clientWidth || !box.clientHeight) {
                        pages.push(remaining.slice(0, 80));
                        remaining = remaining.slice(80);
                        continue;
                    }
                    let low = 1;
                    let high = remaining.length;
                    let best = 1;
                    while (low <= high) {
                        const middle = Math.floor((low + high) / 2);
                        box.textContent = remaining.slice(0, middle);
                        if (box.scrollHeight <= box.clientHeight + 1) { best = middle; low = middle + 1; } else high = middle - 1;
                    }
                    let cut = best;
                    const naturalBreak = remaining.slice(0, best).lastIndexOf('，');
                    if (naturalBreak > best * 0.65) cut = naturalBreak + 1;
                    pages.push(remaining.slice(0, cut).trim());
                    remaining = remaining.slice(cut).trim();
                }
            });
            if (box) box.textContent = originalText;
            return pages.length ? pages : ['信号中断...'];
        }
        function renderChunk() { document.getElementById('storyBox').textContent = storyChunks[currentIndex] || '信号中断...'; document.getElementById('progressNum').textContent = currentIndex + 1; document.getElementById('storyTotal').textContent = storyChunks.length; }
        function nextPart() { document.getElementById('audioPage').play(); if (currentIndex < storyChunks.length - 1) { currentIndex++; renderChunk(); return; } showPage('pageChoice'); }
        function choosePath(path) { document.getElementById('audioSwitch').play(); selectedPath = path; transitionStep = 0; clearTimeout(transitionTimer); const page = document.getElementById('pageTransition'); page.classList.toggle('show-door', path === 'leave'); if (path === 'leave') { document.getElementById('audioDoor').play(); } if (path === 'stay') { document.getElementById('audioLight').play(); } document.getElementById('transitionCopy').textContent = ''; showPage('pageTransition'); if (path === 'leave') { document.getElementById('audioEarth').play(); } }
        function renderTransition() { document.getElementById('transitionCopy').textContent = selectedPath === 'stay' ? '你选择了“留下”。' : '你选择了“离开”。'; }
        function advanceTransition() {
            if (transitionStep === 0) {
                transitionStep = 1;
                document.getElementById('pageTransition').classList.remove('show-door');
                document.getElementById('transitionCopy').textContent = '';
                transitionTimer = setTimeout(() => { transitionStep = 2; renderTransition(); }, 550);
                return;
            }
            if (transitionStep === 1) return;
            document.getElementById('transitionCopy').textContent = selectedPath === 'stay' ? '可是你真的能永远留在那里吗……？' : '你即将回到现实世界……';
            transitionStep = 3;
            transitionTimer = setTimeout(showEnd, 900);
        }
        function renderEndReflection() {
            const reflections = coinCount === 1
                ? [
                    '你又想起那条没有走下去的路，手指停在门把手上。',
                    '你还在想，如果那天再坚持一下，今天会不会不一样。',
                    '你把那句没有说完的话重新念了一遍，还是觉得可惜。'
                ]
                : coinCount <= 4
                    ? [
                        '你站在门口，忽然发现自己记住的，已经不只是另一种可能。',
                        '你开始分不清是在寻找答案，还是只是想再看一眼那扇门。',
                        '你按下投币键前停了一会儿，想起现实里还有一件事等着处理。'
                    ]
                    : [
                        '你把手从投币口旁边收回来，听见窗外有人关上了门。',
                        '你看着那扇门，肩膀慢慢放松下来，转身拿起了桌上的钥匙。',
                        '你没有再数那些没有发生的日子，只低头整理好手里的东西。'
                    ];
            document.getElementById('endReflection').textContent = reflections[Math.floor(Math.random() * reflections.length)];
        }
        function showEnd() { showPage('pageEnd'); renderEndReflection(); }
        function restartGame() { document.getElementById('audioEarth').pause(); document.getElementById('audioEarth').currentTime = 0; document.getElementById('audioCoin').play(); document.getElementById('ifInput').value = '如果当年没走艺术'; updateCoinUI(); showPage('pageMenu'); }
        function saveHistory(ifText, story) { const history = JSON.parse(localStorage.getItem('ifHistory') || '[]'); const now = new Date(); const date = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'); const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'); history.unshift({ time: date + ' ' + time, ifText, story }); localStorage.setItem('ifHistory', JSON.stringify(history.slice(0, 20))); }
        function openHistory() { document.getElementById('audioSwitch').play();
            const history = JSON.parse(localStorage.getItem('ifHistory') || '[]');
            historyPage = 0;
            renderHistoryPage(history);
            showPage('pageHistory');
        }
        function renderHistoryPage(history) {
            const start = historyPage * 4;
            const pageItems = history.slice(start, start + 4);
            document.getElementById('historyList').innerHTML = pageItems.length ? pageItems.map((item, index) => '<button class="record" onclick="openHistoryEntry(' + (start + index) + ')"><strong>' + escapeHtml(item.time + ' · ' + item.ifText) + '</strong></button>').join('') : '<div class="record">还没有通话记录</div>';
        }
        function previousHistoryPage() { document.getElementById('audioPage').play(); if (historyPage === 0) return; historyPage--; renderHistoryPage(JSON.parse(localStorage.getItem('ifHistory') || '[]')); }
        function nextHistoryPage() { document.getElementById('audioPage').play(); const history = JSON.parse(localStorage.getItem('ifHistory') || '[]'); if ((historyPage + 1) * 4 >= history.length) return; historyPage++; renderHistoryPage(history); }
        function openHistoryEntry(index) {
            const item = JSON.parse(localStorage.getItem('ifHistory') || '[]')[index];
            if (!item) return;
            showPage('pageHistoryRead');
            historyReadChunks = splitByDelimiter(item.story || item.snippet || '这次通话没有留下故事。', document.getElementById('historyReadCopy'));
            historyReadIndex = 0;
            renderHistoryEntryPart();
        }
        function renderHistoryEntryPart() { document.getElementById('historyReadCopy').textContent = historyReadChunks[historyReadIndex] || '信号中断...'; document.getElementById('historyReadProgressNum').textContent = historyReadIndex + 1; document.getElementById('historyReadTotal').textContent = historyReadChunks.length; }
        function nextHistoryEntryPart() { document.getElementById('audioPage').play(); if (historyReadIndex < historyReadChunks.length - 1) { historyReadIndex++; renderHistoryEntryPart(); return; } closeHistoryRead(); }
        function closeHistoryRead() { document.getElementById('audioSwitch').play(); showPage('pageHistory'); }
        function closeHistory() { document.getElementById('audioSwitch').play(); showPage('pageMenu'); }
        function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]); }
        updateCoinUI();
    </script>
</body>
</html>
